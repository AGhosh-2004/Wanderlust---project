<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MapLibre Map</title>
  
  <!-- CSS belongs in the <head> so the page styles correctly before rendering -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.css" />

  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <!-- 1. The DOM container must exist first -->
  <div id="map"></div>

  <!-- 2. Library script: downloads and defines the 'maplibregl' object -->
  <script src="https://unpkg.com/maplibre-gl@5.23.0/dist/maplibre-gl.js"></script>

  <!-- 3. Your custom logic: runs after the library and DOM are ready -->
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: [0, 20],
      zoom: 2
    });

    const myLocation = "Eiffel Tower";
    const myCountry = "France";

    async function locateAndMark(place, country) {
      const query = encodeURIComponent(`${place}, ${country}`);
      console.log(query);
      const endpoint = `https://nominatim.openstreetmap.org/search?q=${query}&format=json&limit=1`;

      try {
        const response = await fetch(endpoint);
        const data = await response.json();

        if (!data.length) return;
        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);

        map.flyTo({ center: [lon, lat], zoom: 15 });

        // const popup = new maplibregl.Popup({ offset: 25 })
        //   .setHTML(`<strong>${place}</strong><br><small>${country}</small>`);

        new maplibregl.Marker({ color: '#e74c3c' })
          .setLngLat([lon, lat])
          .addTo(map);
      } catch (err) {
        console.error(err);
      }
    }

    map.on('load', () => {
      locateAndMark(myLocation, myCountry);
    });
  </script>
</body>
</html>
